name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

      - name: Install Typst 0.14.2
        run: cargo install --locked typst-cli --version 0.14.2

      - name: Compile smoke tests and examples
        run: |
          mkdir -p build
          for source in tests/*.typ examples/*.typ; do
            output="build/$(basename "${source%.typ}").pdf"
            typst compile "$source" "$output" --root .
          done
